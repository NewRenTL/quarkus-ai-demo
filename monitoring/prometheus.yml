global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'order-quarkus'
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['order-quarkus:8080']
        labels:
          framework: 'quarkus'
          service: 'order-service'

  - job_name: 'ai-quarkus'
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['ai-quarkus:8081']
        labels:
          framework: 'quarkus'
          service: 'ai-service'

  - job_name: 'order-spring'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-spring:8090']
        labels:
          framework: 'spring'
          service: 'order-service'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
