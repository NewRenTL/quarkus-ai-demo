# ============================================================
# AI INTELLIGENCE SERVICE — QUARKUS + LANGCHAIN4J + GEMINI
# ============================================================

quarkus.application.name=ai-quarkus
quarkus.http.port=8081

# --- Gemini 2.5 Flash ---
quarkus.langchain4j.gemini.api-key=${GEMINI_API_KEY:your-api-key-here}
quarkus.langchain4j.gemini.model-name=gemini-2.5-flash
quarkus.langchain4j.gemini.temperature=0.1
quarkus.langchain4j.gemini.max-output-tokens=512
quarkus.langchain4j.timeout=30s
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# --- Kafka (Dev Services en dev) ---
%prod.kafka.bootstrap.servers=${KAFKA_BROKERS:localhost:9092}

mp.messaging.incoming.orders-created-in.connector=smallrye-kafka
mp.messaging.incoming.orders-created-in.topic=orders.created
mp.messaging.incoming.orders-created-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders-created-in.group.id=ai-service

mp.messaging.outgoing.ai-analysis-out.connector=smallrye-kafka
mp.messaging.outgoing.ai-analysis-out.topic=ai.analysis
mp.messaging.outgoing.ai-analysis-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Logs ---
quarkus.log.level=INFO
quarkus.log.category."com.demo".level=DEBUG
