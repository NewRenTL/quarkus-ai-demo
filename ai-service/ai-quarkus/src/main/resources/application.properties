# ============================================================
# AI SERVICE — QUARKUS  (bootstrap local)
# ============================================================

quarkus.application.name=ai-quarkus
quarkus.http.port=8081

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=AI Service — Quarkus + Gemini

quarkus.log.category."com.demo".level=DEBUG

# --- Config Server ---
quarkus.spring-cloud-config.url=http://localhost:8888
quarkus.spring-cloud-config.fail-fast=false

# GEMINI_API_KEY must be set as environment variable
# Uses Gemini's OpenAI-compatible endpoint
quarkus.langchain4j.openai.api-key=${GEMINI_API_KEY}
quarkus.langchain4j.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
quarkus.langchain4j.openai.chat-model.model-name=gemini-2.5-flash

# --- Kafka (solo en prod) ---
%prod.kafka.bootstrap.servers=${KAFKA_BROKERS:localhost:9092}

%prod.quarkus.spring-cloud-config.url=http://config-server:8888
%prod.quarkus.spring-cloud-config.fail-fast=true
